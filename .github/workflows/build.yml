name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']          # push a tag like v1.0.0 -> build, sign, publish a GitHub Release
  workflow_dispatch:      # "Run workflow" button -> build only, APK as a download

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Validates gradle-wrapper.jar against Gradle's published checksums and caches dependencies.
      - uses: gradle/actions/setup-gradle@v4

      # Keeps the fallback key the same between runs, so fallback builds can update each other.
      # (GitHub drops caches unused for 7 days; after that a new fallback key is made.)
      # The SHORTSFINDER_* secret names stay as they were so updates keep the same signing key.
      - name: Restore fallback key
        uses: actions/cache@v4
        with:
          path: ~/.fallback-signing/fallback.keystore
          key: ytshortsmaker-fallback-keystore-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHORTSFINDER_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.SHORTSFINDER_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.SHORTSFINDER_KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shortsfinder-release.keystore"
            echo "SHORTSFINDER_KEYSTORE_FILE=$RUNNER_TEMP/shortsfinder-release.keystore" >> "$GITHUB_ENV"
            echo "SHORTSFINDER_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
            echo "SHORTSFINDER_KEY_ALIAS=${KEY_ALIAS:-shortsfinder}" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "::warning::SHORTSFINDER_KEYSTORE_B64 / SHORTSFINDER_KEY_PASS secrets are not set: signing with the cached fallback key. See README > Signing."
            FB="$HOME/.fallback-signing/fallback.keystore"
            if [ ! -f "$FB" ]; then
              mkdir -p "$(dirname "$FB")"
              keytool -genkeypair -keystore "$FB" -storetype PKCS12 -alias fallback \
                -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Buggy Games YT fallback, O=Buggy Games YT"
              echo "Made a new fallback key."
            fi
            echo "SHORTSFINDER_KEYSTORE_FILE=$FB" >> "$GITHUB_ENV"
            echo "SHORTSFINDER_KEY_PASS=android" >> "$GITHUB_ENV"
            echo "SHORTSFINDER_KEY_ALIAS=fallback" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=fallback key" >> "$GITHUB_ENV"
          fi

      - name: Work out version
        run: |
          BASE=$(grep -oP '^val baseVersionName = "\K[^"]+' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${BASE}-build${GITHUB_RUN_NUMBER}"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "Version: $VER (code ${GITHUB_RUN_NUMBER})"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VER }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename and verify APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "YTShortsMaker-$VER.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "YTShortsMaker-$VER.apk"
          rm -f "$RUNNER_TEMP/shortsfinder-release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: YTShortsMaker-${{ env.VER }}
          path: YTShortsMaker-${{ env.VER }}.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YTShortsMaker-${{ env.VER }}.apk
          generate_release_notes: true
          body: |
            YT Shorts Maker ${{ env.VER }}. Signed with the ${{ env.SIGNED_WITH }}.
